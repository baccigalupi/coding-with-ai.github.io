---
layout: default
---

<section class="post-chat home-layout">
  <a class="d-block d-md-none mb-3" href="#recent-posts">See recent posts</a>

  <div class="home-main-content chat-columns">
    {{ content }}
  </div>

  <aside class="home-recent-posts" id="recent-posts">
    <h3 class="mt-3">Recent posts</h3>
    <ul class="list-unstyled">
      {% for post in site.posts limit:3 %}
      <li>
        <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
        <p>{{ post.description }}</p>
      </li>
      {% endfor %}
    </ul>
    <a href="/toc">See all posts</a>

    <h3 class="mt-3"><a href="{{ '/about' | relative_url }}">About</a></h3>
    <ul class="list-unstyled">
      <li><a href="{{ '/about/author' | relative_url }}">About me</a></li>
      <li><a href="{{ '/about/header' | relative_url }}">About the header</a></li>
    </ul>
  </aside>
</section>
